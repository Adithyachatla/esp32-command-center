; JARVIS - ESP32 Command Center
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Frontend files in /data are stored in LittleFS
board_build.filesystem = littlefs
; Wi-Fi + BLE does not fit the default 1.2 MB app slot.
; huge_app.csv = 3 MB app, ~1 MB filesystem, no OTA.
board_build.partitions = huge_app.csv

lib_deps =
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.7.0

build_flags =
    -D CORE_DEBUG_LEVEL=1
